<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danmaku Overlay</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #danmaku-stage {
      position: relative;
      width: 100vw;
      height: 260px;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    .danmaku {
      position: absolute;
      right: -100%;
      white-space: nowrap;
      color: #000;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      text-shadow:
        1px 1px 0 rgba(255,255,255,0.8),
        -1px -1px 0 rgba(255,255,255,0.8);
      animation-name: fly-across;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes fly-across {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(-100vw - 120%));
      }
    }
  </style>
</head>

<body>
  <div id="danmaku-stage"></div>

  <script>
    const comments = [
      "japanese music 4 lyfeeee",
      "東京ライブハウス案内",
      "new indie discoveries",
      "ｗｗｗｗｗ",
      "scene notes",
      "きたあああああ",
      "dig deeper",
      "lets share earphones",
      "tokyo underground",
      "神曲",
      "artist archives",
      "(´･ᴗ･ )",
      "88888888888",
      "live reports",
      "ｷﾀ━━━━(ﾟ∀ﾟ)━━━━!!",
      "music culture journal",
      "whatcha listening too?"
    ];

    const stage = document.getElementById("danmaku-stage");

    function createDanmaku() {
      const comment = document.createElement("div");
      comment.className = "danmaku";
      comment.textContent = comments[Math.floor(Math.random() * comments.length)];

      const stageHeight = stage.offsetHeight;
      const top = Math.random() * (stageHeight - 30);

      comment.style.top = top + "px";
      comment.style.animationDuration = (8 + Math.random() * 6) + "s";
      comment.style.fontSize = (15 + Math.random() * 8) + "px";

      stage.appendChild(comment);

      comment.addEventListener("animationend", () => {
        comment.remove();
      });
    }

    setInterval(createDanmaku, 700);

    for (let i = 0; i < 8; i++) {
      setTimeout(createDanmaku, i * 300);
    }
  </script>
</body>
</html>
