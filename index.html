<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danmaku Overlay</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #danmaku-stage {
      position: relative;
      width: 100vw;
      height: 260px;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    .danmaku {
      position: absolute;
      right: -100%;
      white-space: nowrap;
      color: #000;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      text-shadow:
        1px 1px 0 rgba(255,255,255,0.8),
        -1px -1px 0 rgba(255,255,255,0.8);
      animation-name: fly-across;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes fly-across {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(-100vw - 120%));
      }
    }
  </style>
</head>

<body>
  <div id="danmaku-stage"></div>

  <script>
    const comments = [
      "japanese music 4 lyfeeee",
      "東京ライブハウス案内",
      "new indie discoveries",
      "ｗｗｗｗｗ",
      "scene notes",
      "きたあああああ",
      "dig deeper",
      "lets share earphones",
      "tokyo underground",
      "神曲",
      "artist archives",
      "(´･ᴗ･ )",
      "88888888888",
      "live reports",
      "ｷﾀ━━━━(ﾟ∀ﾟ)━━━━!!",
      "music culture journal",
      "whatcha listening to?"
    ];

   const stage = document.getElementById("danmaku");

function addComment() {
  const el = document.createElement("div");

  el.className = "comment";

  el.textContent =
    comments[Math.floor(Math.random() * comments.length)];

  el.style.top =
    Math.random() * 240 + "px";

  el.style.animationDuration =
    (5 + Math.random() * 3) + "s";

  stage.appendChild(el);

  setTimeout(() => {
    el.remove();
  }, 9000);
}

/* INSTANT BURST ON PAGE LOAD */
for (let i = 0; i < 25; i++) {
  setTimeout(addComment, i * 60);
}

/* CONTINUOUS FLOW */
setInterval(addComment, 180);
</script>
