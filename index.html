<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
}

#danmaku {
  position: relative;
  width: 100vw;
  height: 260px;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

.comment {
  position: absolute;
  white-space: nowrap;
  color: black;
  font-size: 24px;
  font-weight: bold;
  text-shadow: 1px 1px 2px white;
}
</style>
</head>

<body>

<div id="danmaku"></div>

<script>
const comments = [
  "japanese music 4 lyfeeee",
  "東京ライブハウス案内",
  "new indie discoveries",
  "ｗｗｗｗｗ",
  "scene notes",
  "きたあああああ",
  "dig deeper",
  "lets share earphones",
  "tokyo underground",
  "神曲",
  "artist archives",
  "(´･ᴗ･ )",
  "88888888888",
  "live reports",
  "ｷﾀ━━━━(ﾟ∀ﾟ)━━━━!!",
  "music culture journal",
  "whatcha listening to?"
];

const stage = document.getElementById("danmaku");

function addComment() {

  const el = document.createElement("div");

  el.className = "comment";

  el.textContent =
    comments[Math.floor(Math.random() * comments.length)];

  const y = Math.random() * 220;

  el.style.top = y + "px";

  el.style.left = window.innerWidth + "px";

  stage.appendChild(el);

  const distance =
    window.innerWidth + el.offsetWidth + 100;

  el.animate(
    [
      { transform: "translateX(0)" },
      { transform: "translateX(-" + distance + "px)" }
    ],
    {
      duration: 9000,
      easing: "linear",
      fill: "forwards"
    }
  );

  setTimeout(() => {
    el.remove();
  }, 9000);
}

/* gentle startup */
for (let i = 0; i < 4; i++) {
  setTimeout(addComment, i * 900);
}

/* slower ongoing flow */
setInterval(addComment, 1800);

</script>

</body>
</html>
