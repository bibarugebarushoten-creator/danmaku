<!doctype html>
<html>
<head>
<meta charset="utf-8">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

#danmaku {
  position: relative;
  width: 100vw;
  height: 260px;
  overflow: hidden;
  background: transparent;
}

.comment {
  position: absolute;
  white-space: nowrap;
  color: black;
  font-size: 24px;
  font-weight: bold;
  text-shadow: 1px 1px 2px white;
  animation: moveLeft linear forwards;
}

@keyframes moveLeft {
  from {
    transform: translateX(100vw);
  }

  to {
    transform: translateX(-120%);
  }
}
</style>
</head>

<body>

<div id="danmaku"></div>

<script>
const comments = [
   "japanese music 4 lyfeeee",
      "東京ライブハウス案内",
      "new indie discoveries",
      "ｗｗｗｗｗ",
      "scene notes",
      "きたあああああ",
      "dig deeper",
      "lets share earphones",
      "tokyo underground",
      "神曲",
      "artist archives",
      "(´･ᴗ･ )",
      "88888888888",
      "live reports",
      "ｷﾀ━━━━(ﾟ∀ﾟ)━━━━!!",
      "music culture journal",
      "whatcha listening to?"
];

const stage = document.getElementById("danmaku");

function addComment() {

  const el = document.createElement("div");

  el.className = "comment";

  el.textContent =
    comments[Math.floor(Math.random() * comments.length)];

  el.style.top =
    Math.random() * 230 + "px";

  el.style.left =
    Math.random() * 200 + "px";

  el.style.animationDuration =
    (2 + Math.random() * 2) + "s";

  stage.appendChild(el);

  setTimeout(() => {
    el.remove();
  }, 5000);
}

/* HUGE INSTANT BURST */
for (let i = 0; i < 40; i++) {
  addComment();
}

/* CONTINUOUS FLOW */
setInterval(addComment, 120);

</script>

</body>
</html>
